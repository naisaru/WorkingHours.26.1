name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | tail -1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download pixel font (Press Start 2P, OFL)
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -fsSL -o app/src/main/assets/fonts/PressStart2P-Regular.ttf \
            https://github.com/google/fonts/raw/main/ofl/pressstart2p/PressStart2P-Regular.ttf \
            || echo "Font download failed, app will use fallback font"

      - name: Build APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk WorkingHours.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WorkingHours
          path: WorkingHours.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.${{ github.run_number }}
          name: Working hours 1.2 (сборка ${{ github.run_number }})
          files: WorkingHours.apk
